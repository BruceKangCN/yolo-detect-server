[project]
name = "yolo-detect-server"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bruce Kang", email = "brucekangcn@gmail.com" }
]
requires-python = ">=3.12, <3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "numpy>=1.26.4",
    "polars>=1.43.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rknn-toolkit-lite2>=2.3.2 ; platform_machine == 'aarch64'",
    "rknn-toolkit2>=2.3.2 ; platform_machine == 'AMD64' or platform_machine == 'x86_64'",
    "ultralytics>=8.4.120",
    "uvicorn>=0.52.1",
]

[project.scripts]
yolo-detect-server = "yolo_detect_server:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipympl>=0.10.0",
    "pyside6>=6.11.2",
    "ruff>=0.16.1",
    "uv-script>=0.1.9",
]

[tool.uvs.scripts]
fmt = "ruff format"
lint = "ruff check"
dev = "fastapi dev src/yolo_detect_server/app.py"
